<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Game &middot; Stat Scraps</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/statscraps-icon-32.png" />
<link rel="apple-touch-icon" href="/img/statscraps-icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b0d12" />
<script src="/js/pwa.js" defer></script>
<link rel="stylesheet" href="/css/scrappy.css" />
<script src="/js/scrappy.js" defer></script>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/brand.css" />
<link rel="stylesheet" href="/css/game-live.css" />
<link rel="stylesheet" href="/css/advanced.css" />
<link rel="stylesheet" href="/css/kids.css" />
<link rel="stylesheet" href="/css/highlights.css" />
<link rel="stylesheet" href="/css/themes.css" />
<link rel="stylesheet" href="/css/bingebandit.css" />
<link rel="stylesheet" href="/css/a11y.css" />
<script src="/js/theme-boot.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-es.js"></script>
<script src="/js/a11y.js" defer></script>
<script src="/js/theme-picker.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-icon">
      <img src="/img/scrappy-head.png" alt="Stat Scraps" />
    </div>
    <div>
      <h1>Game</h1>
      <div class="subtitle" id="statusNote">Loading&hellip;</div>
    </div>
  </div>
  <nav class="top-nav">
    <a href="/">&larr; Back to site</a>
    <a href="/upcoming.html">Upcoming</a>
    <a href="/rankings.html">Rankings</a>
    <a href="/standings.html">Standings</a>
    <a href="/leaders.html">Leaders</a>
    <a href="/lines.html">Lines</a>
    <a href="/recruiting.html">Recruiting</a>
  </nav>
</header>

<main>
  <div class="game-scorebug" id="gameScorebug">Loading&hellip;</div>
  <div class="refresh-note" id="gameRefreshNote" aria-live="polite"></div>
  <div class="tab-bar game-tabs" id="gameTabs" role="tablist">
    <button type="button" class="tab-btn" role="tab" data-gtab="cast">Gamecast</button>
    <button type="button" class="tab-btn" role="tab" data-gtab="box">Box Score</button>
    <button type="button" class="tab-btn" role="tab" data-gtab="matchup">Matchup</button>
    <button type="button" class="tab-btn" role="tab" data-gtab="watch">Watch &amp; Listen</button>
    <button type="button" class="tab-btn" role="tab" data-gtab="play">&#127922; Play</button>
    <button type="button" class="tab-btn" role="tab" data-gtab="chat">&#128172; Chat</button>
  </div>

  <div class="game-tab-panel" data-gpanel="cast" role="tabpanel">
    <div id="fieldPositionWrap"></div>
    <div class="game-situation empty-note" id="gameSituation"></div>
    <div id="gameLiveFeed"></div>
    <div id="gameHighlights"></div>
    <div id="gameWinProb"></div>
    <div id="gameMomentum"></div>
    <div id="gameDrives"></div>
  </div>

  <div class="game-tab-panel" data-gpanel="box" role="tabpanel">
    <div id="gameAdvanced"></div>
    <div id="gameBoxScore"></div>
    <div id="gameDetailSections"></div>
  </div>

  <div class="game-tab-panel" data-gpanel="matchup" role="tabpanel">
    <div id="gamePreview"></div>
    <div id="gameMatchup"></div>
    <div id="gameInjuries"></div>
    <div id="gameForm"></div>
  </div>

  <div class="game-tab-panel" data-gpanel="watch" role="tabpanel">
    <div id="gameWatch"></div>
    <div id="gameRadio"></div>
  </div>

  <div class="game-tab-panel" data-gpanel="play" role="tabpanel">
    <div id="gamePlay"></div>
  </div>

  <div class="game-tab-panel" data-gpanel="chat" role="tabpanel">
    <div id="gameChat"></div>
  </div>
</main>

<footer class="foot">Stat Scraps</footer>

<script src="/js/shared.js"></script>
<script src="/js/kids-core.js"></script>
<script src="/js/gameday-core.js"></script>
<script src="/js/kids.js"></script>
<script src="/js/game-sections.js"></script>
<script src="/js/game-live.js"></script>
<script src="/js/advanced.js"></script>
<script src="/js/game.js"></script>
<script src="/js/radio.js"></script>
<script src="/js/gameday.js"></script>
<script src="/js/game-tabs.js"></script>
</body>
</html>
