<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Playoffs &amp; Brackets &middot; Stat Scraps</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/statscraps-icon-32.png" />
<link rel="apple-touch-icon" href="/img/statscraps-icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b0d12" />
<script src="/js/pwa.js" defer></script>
<link rel="stylesheet" href="/css/scrappy.css" />
<script src="/js/scrappy.js" defer></script>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/brand.css" />
<link rel="stylesheet" href="/css/kids.css" />
<link rel="stylesheet" href="/css/leagues.css" />
<link rel="stylesheet" href="/css/playoffs.css" />
<link rel="stylesheet" href="/css/themes.css" />
<link rel="stylesheet" href="/css/a11y.css" />
<script src="/js/theme-boot.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-es.js"></script>
<script src="/js/a11y.js" defer></script>
<script src="/js/theme-picker.js" defer></script>
</head>
<body class="playoffs-page">
<header class="top">
  <div class="brand">
    <div class="brand-icon">
      <img src="/img/scrappy-head.png" alt="Stat Scraps" />
    </div>
    <div>
      <h1>Playoffs &amp; Brackets</h1>
      <div class="subtitle" id="sourceNote">College Football Playoff, bowls and March Madness</div>
    </div>
  </div>
  <nav class="top-nav">
    <a href="/">Scores</a>
    <a href="/rankings.html">Rankings</a>
    <a href="/standings.html">Standings</a>
  </nav>
</header>

<main>
  <div class="tab-bar" id="hubTabs" role="tablist">
    <button class="tab-btn" data-view="cfp" role="tab">&#127944; College Football Playoff</button>
    <button class="tab-btn" data-view="bowls" role="tab">&#127942; Bowls</button>
    <button class="tab-btn" data-view="mm" role="tab">&#127936; March Madness</button>
  </div>

  <div class="hub-season">
    <button type="button" id="seasonPrev" aria-label="Earlier season">&lsaquo;</button>
    <span id="seasonLabel">&nbsp;</span>
    <button type="button" id="seasonNext" aria-label="Later season">&rsaquo;</button>
  </div>

  <section class="challenge" id="challenge" aria-labelledby="challengeTitle">
    <h2 class="section-title" id="challengeTitle">&#127919; Family bracket challenge</h2>
    <p class="challenge-help" id="challengeHelp"></p>
    <div class="player-chips" id="challengePlayers"></div>
    <form class="add-player" id="challengeAddPlayer">
      <label for="challengeName" class="visually-hidden">Name</label>
      <input id="challengeName" maxlength="20" placeholder="Add a name" autocomplete="off" />
      <button type="submit">+ Add</button>
    </form>
    <div class="challenge-boards">
      <div id="challengeLocal"></div>
      <div id="challengeLeague"></div>
    </div>
  </section>

  <div id="hubBody"><div class="empty-note">Loading&hellip;</div></div>
</main>

<footer class="foot">Stat Scraps</footer>

<script src="/js/shared.js"></script>
<script src="/js/kids-core.js"></script>
<script src="/js/gameday-core.js"></script>
<script src="/js/kids.js"></script>
<script src="/js/leagues.js"></script>
<script src="/js/brackets-core.js"></script>
<script src="/js/brackets.js"></script>
</body>
</html>
