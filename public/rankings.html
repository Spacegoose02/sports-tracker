<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rankings &middot; Stat Scraps</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/statscraps-icon-32.png" />
<link rel="apple-touch-icon" href="/img/statscraps-icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b0d12" />
<script src="/js/pwa.js" defer></script>
<link rel="stylesheet" href="/css/scrappy.css" />
<script src="/js/scrappy.js" defer></script>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/brand.css" />
<link rel="stylesheet" href="/css/stats.css" />
<link rel="stylesheet" href="/css/kids.css" />
<link rel="stylesheet" href="/css/themes.css" />
<link rel="stylesheet" href="/css/a11y.css" />
<script src="/js/theme-boot.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-es.js"></script>
<script src="/js/a11y.js" defer></script>
<script src="/js/theme-picker.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-icon">
      <img src="/img/scrappy-head.png" alt="Stat Scraps" />
    </div>
    <div>
      <h1>Rankings</h1>
      <div class="subtitle" id="sourceNote">Loading&hellip;</div>
    </div>
  </div>
  <nav class="top-nav">
    <a href="/">&larr; Schedule &amp; Scores</a>
    <a href="/upcoming.html">Upcoming</a>
    <a href="/standings.html">Standings</a>
    <a href="/leaders.html">Leaders</a>
    <a href="/lines.html">Lines</a>
    <a href="/recruiting.html">Recruiting</a>
  </nav>
</header>

<main>
  <div class="week-bar">
    <label for="pollSelect">Poll</label>
    <select id="pollSelect"></select>
    <label for="weekSelect" id="weekLabel" hidden>Week</label>
    <select id="weekSelect" hidden></select>
  </div>

  <div class="tab-bar" id="viewTabs">
    <button class="tab-btn active" type="button" data-view="poll">Poll</button>
    <button class="tab-btn" type="button" data-view="compare">Compare polls</button>
  </div>

  <section id="view-poll">
    <h2 class="section-title" id="pollHeadline">Top 25</h2>
    <div class="movers" id="movers"></div>
    <div class="table-wrap">
      <table class="data-table" id="rankingsTable">
        <thead>
          <tr>
            <th class="rank-cell">Rk</th>
            <th>Team</th>
            <th>Record</th>
            <th>Points</th>
            <th>1st Place</th>
            <th>Last Week</th>
            <th>Move</th>
          </tr>
        </thead>
        <tbody id="rankingsBody">
          <tr><td colspan="7" class="empty-note">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
    <div class="others-votes" id="othersVotes"></div>
    <div class="others-votes" id="droppedOut"></div>
  </section>

  <section id="view-compare" hidden>
    <h2 class="section-title">Every major poll, side by side</h2>
    <div class="table-wrap">
      <table class="data-table">
        <thead id="compareHead"></thead>
        <tbody id="compareBody"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="foot">Stat Scraps</footer>

<script src="/js/shared.js"></script>
<script src="/js/kids-core.js"></script>
<script src="/js/gameday-core.js"></script>
<script src="/js/kids.js"></script>
<script src="/js/rankings.js"></script>
</body>
</html>
