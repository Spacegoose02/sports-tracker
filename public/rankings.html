<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rankings &middot; CFB Tracker</title>
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/img/cfbtracker-icon-32.png" />
<link rel="apple-touch-icon" href="/img/cfbtracker-icon-180.png" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-icon">
      <img src="/img/cfbtracker-icon.png" alt="CFB Tracker" />
    </div>
    <div>
      <h1>Rankings</h1>
      <div class="subtitle" id="sourceNote">Loading&hellip;</div>
    </div>
  </div>
  <nav class="top-nav">
    <a href="/">&larr; Schedule &amp; Scores</a>
    <a href="/upcoming.html">Upcoming</a>
    <a href="/standings.html">Standings</a>
  </nav>
</header>

<main>
  <div class="week-bar">
    <label for="pollSelect">Poll</label>
    <select id="pollSelect"></select>
  </div>

  <section>
    <h2 class="section-title" id="pollHeadline">Top 25</h2>
    <div class="table-wrap">
      <table class="data-table" id="rankingsTable">
        <thead>
          <tr>
            <th class="rank-cell">Rk</th>
            <th>Team</th>
            <th>Record</th>
            <th>Points</th>
            <th>1st Place</th>
            <th>Trend</th>
          </tr>
        </thead>
        <tbody id="rankingsBody">
          <tr><td colspan="6" class="empty-note">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
    <div class="others-votes" id="othersVotes"></div>
  </section>
</main>

<footer class="foot">CFB Tracker</footer>

<script src="/js/shared.js"></script>
<script src="/js/kids-core.js"></script>
<script src="/js/kids.js"></script>
<script src="/js/rankings.js"></script>
</body>
</html>
