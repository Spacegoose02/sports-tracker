# "Notable Games" custom-api widget for Dynacat / Glance.
#
# Reads YOUR notable games (the ones you starred while signed in to Stat
# Scraps) from GET /api/account/notable/feed. Each pick comes back with
# live score, status, broadcast and venue, grouped by week. Star or unstar
# a game on the site and it shows up here on the next refresh, no YAML
# edits needed. See docs/dashboards.md for every dashboard endpoint.
#
# SETUP:
# 1. Sign in to Stat Scraps, open Account, and copy your private key from
#    "Connect other apps".
# 2. Give it to Dynacat/Glance as an environment variable, e.g. in
#    docker-compose:  environment: [STAT_SCRAPS_KEY=<your key>]
#    (or paste it in place of ${STAT_SCRAPS_KEY} below).
# 3. Replace YOUR-STAT-SCRAPS-HOST:PORT with wherever the container is
#    reachable from Dynacat (its container name on a shared Docker network,
#    or unraid-ip:3004 using the host port you mapped).
# 4. `weeks=3` shows the current week plus the next two. Drop it for just
#    the current week.
#
# Want the admin's site-wide picks instead (no key)? Use
#   url: "http://YOUR-STAT-SCRAPS-HOST:PORT/api/notable/feed?weeks=3"
# and delete the headers block. The JSON has the same shape.

- type: custom-api
  title: Notable Games
  cache: 2m
  update-interval: 2m
  url: "http://YOUR-STAT-SCRAPS-HOST:PORT/api/account/notable/feed?weeks=3"
  headers:
    Authorization: "Bearer ${STAT_SCRAPS_KEY}"
  template: |
    {{ $weeks := .JSON.Array "weeks" }}
    <div class="ntg-wrap">
      <ul class="list collapsible-container" data-collapse-after="1" style="list-style:none;padding:0;margin:0;">
        {{ range $wk := $weeks }}
          {{ $games := $wk.Array "games" }}
          {{ if gt (len $games) 0 }}
            <li>
              <div class="ntg-week-block">
                <div class="ntg-heading">Week {{ $wk.String "week" }} Notable Games</div>
                <ul class="ntg-grid">
                  {{ range $g := $games }}
                    {{ template "notable-game" $g }}
                  {{ end }}
                </ul>
              </div>
            </li>
          {{ end }}
        {{ end }}
      </ul>
    </div>

    {{ define "notable-game" }}
      {{ $g := . }}
      {{ $state := $g.String "status.state" }}
      {{ $label := $g.String "label" }}
      {{ $venue := $g.String "venue" }}
      {{ $broadcast := $g.String "broadcast" }}
      {{ $awayWinner := $g.Bool "away.winner" }}
      {{ $homeWinner := $g.Bool "home.winner" }}
      <li class="ntg-row">
        <div class="ntg-status-row">
          {{ if eq $state "in" }}<span class="ntg-live-dot">&#9679; LIVE</span>{{ end }}
          <span class="ntg-status">{{ $g.String "status.shortDetail" }}</span>
          {{ if ne $broadcast "" }}<span class="ntg-net">{{ $broadcast }}</span>{{ end }}
        </div>
        <div class="ntg-scorebug">
          <div class="ntg-side">
            <img class="ntg-logo" src="{{ $g.String "away.logo" }}">
            <span class="ntg-abbr {{ if $awayWinner }}ntg-winner{{ end }}">{{ $g.String "away.abbreviation" }}</span>
          </div>
          <div class="ntg-score-block">
            <span class="ntg-score {{ if $awayWinner }}ntg-winner{{ end }}">{{ $g.String "away.score" }}</span>
            <span class="ntg-dash">&ndash;</span>
            <span class="ntg-score {{ if $homeWinner }}ntg-winner{{ end }}">{{ $g.String "home.score" }}</span>
          </div>
          <div class="ntg-side ntg-side-right">
            <span class="ntg-abbr {{ if $homeWinner }}ntg-winner{{ end }}">{{ $g.String "home.abbreviation" }}</span>
            <img class="ntg-logo" src="{{ $g.String "home.logo" }}">
          </div>
        </div>

        <div class="ntg-tooltip-card">
          <div class="ntg-tooltip-title">{{ $g.String "away.name" }} @ {{ $g.String "home.name" }}</div>
          {{ if ne $label "" }}<div class="ntg-tooltip-row"><span>{{ $label }}</span></div>{{ end }}
          {{ if ne $venue "" }}<div class="ntg-tooltip-row"><span>{{ $venue }}</span></div>{{ end }}
          {{ if ne $broadcast "" }}<div class="ntg-tooltip-row"><span>{{ $broadcast }}</span></div>{{ end }}
        </div>
      </li>
    {{ end }}

    <style>
      .ntg-wrap { width: 100%; box-sizing: border-box; }
      .ntg-week-block + .ntg-week-block,
      li:not(:first-child) > .ntg-week-block {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--glance-divider);
      }
      .ntg-heading {
        font-size: 1.3rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--glance-accent-color);
        margin-bottom: 14px;
      }
      .ntg-grid {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      /* Scorebug card: a status strip on top (live/time + network), then
         a dedicated row for logos/abbreviations/score that never has to
         share space with anything else, so nothing overlaps regardless
         of team name length. */
      .ntg-row {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--glance-divider);
        border-radius: 10px;
        cursor: default;
      }
      .ntg-status-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.78em;
        color: var(--glance-muted-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ntg-live-dot { color: #dc2626; font-weight: 800; flex-shrink: 0; }
      .ntg-status { overflow: hidden; text-overflow: ellipsis; }
      .ntg-net { flex-shrink: 0; opacity: 0.8; }
      .ntg-scorebug {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .ntg-side {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .ntg-side-right { justify-content: flex-end; }
      .ntg-logo { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
      .ntg-abbr {
        font-weight: 700;
        font-size: 0.95em;
        color: var(--glance-muted-text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ntg-score-block {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 1.3rem;
        font-weight: 800;
        flex-shrink: 0;
        padding: 0 6px;
        color: var(--glance-muted-text);
      }
      .ntg-dash { opacity: 0.4; font-weight: 400; font-size: 1rem; }
      .ntg-winner { color: var(--glance-text-color, #eee); }
      .ntg-tooltip-card {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        z-index: 40;
        background: rgba(10, 10, 12, 0.97);
        border: 1px solid var(--glance-divider);
        border-radius: 8px;
        padding: 10px 12px;
        box-shadow: 0 10px 28px rgba(0,0,0,0.45);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-4px);
        transition: opacity .12s ease, transform .12s ease;
        pointer-events: none;
        white-space: normal;
        font-size: 0.78em;
        color: var(--glance-text-color, #eee);
      }
      .ntg-row:hover .ntg-tooltip-card {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .ntg-tooltip-title {
        font-weight: 700;
        margin-bottom: 6px;
        color: var(--glance-text-color, #eee);
      }
      .ntg-tooltip-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
        color: var(--glance-muted-text);
      }
    </style>

# Notes:
# - season and startWeek default to the current college football week, so
#   nothing needs changing from season to season.
# - A week with no picks is skipped instead of drawing an empty heading.
# - Hover a card to see venue, broadcast and your label for the game.
# - The key only reads. If it leaks, make a new one on the Account page
#   (that also changes your calendar link).
