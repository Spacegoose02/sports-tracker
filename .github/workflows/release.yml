name: Release

# Cuts a release from main: tags vX.Y.Z, publishes the matching image to
# ghcr.io (X.Y.Z, X.Y and latest) and creates the GitHub release.
# Run it from the Actions tab (Release -> Run workflow) and enter a version.
# Release notes come from docs/releases/vX.Y.Z.md when that file exists,
# otherwise GitHub writes them from the merged pull requests.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, e.g. 1.0.0'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check the version
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          echo "MINOR=${VERSION%.*}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/sports-tracker" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.MINOR }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        run: |
          NOTES="docs/releases/v$VERSION.md"
          if [ -f "$NOTES" ]; then
            gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes-file "$NOTES"
          else
            gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --generate-notes
          fi
